<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Haven Boutique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav">
        <img src="HomePageLogo.jpeg" class="logo" height:40px alt="homelogo" >
    </div>
    <div class="productContainer">
        <div class="product">
            <img src="kanjeevaram.png"  class="productImage">
            <div class="productName">Kanjipuram saree</div>
            <div class="price">₹4,999</div>
            <button class="btn">Add To Cart</button>
        </div>
         <div class="product">
            <img src="Cotton.png" class="productImage">
            <div class="productName">Cotton saree</div>
            <div class="price">₹999</div>
            <button class="btn">Add To Cart</button>
        </div>
         <div class="product">
            <img src="Linen.png"  class="productImage">
            <div class="productName">Linen saree</div>
            <div class="price">₹1,099</div>
            <button class="btn">Add To Cart</button>
        </div>
        <div class="product">
            <img src="organza.png"  class="productImage" >
            <div class="productName">Organza saree</div>
            <div class="price">₹1350</div>
            <button class="btn">Add To Cart</button>
        </div>
    </div>
</body>
</html>
